<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3335" viewBox="0 0 1440 3335" role="img" aria-labelledby="title desc">
<title id="title">AIGDOS · run-request 时序图</title>
<desc id="desc">蓄力计示例 · 执行成功 → 独立审查 → 人工验收. 实线：调用、读取或写入；虚线：返回的数据 / 结果。本图展示成功路径。 说明已发布行为，不代表新增测试结果。OBS65 / CAP16 继续阻断，不授予完整正式版本资格。</desc>
