<text x="717.5" y="2321" font-size="17" fill="#25354a" font-weight="400" text-anchor="middle">保留真实审查与关闭输出，供后续验收使用</text>
<text x="42" y="2383" font-size="16" fill="#54687e" font-weight="400" text-anchor="start">PASS 要求参与者独立、提交绑定一致且没有未完成交接；通过独立审查不等于人工验收。</text>
<text x="42" y="2406" font-size="16" fill="#54687e" font-weight="400" text-anchor="start">reject 将运行时任务退回 IN_PROGRESS；审查状态变化不能修改工作产物。</text>
<text x="42" y="2429" font-size="16" fill="#54687e" font-weight="400" text-anchor="start">review/review.md 与保存的关闭输出由审查者建立，不是 run-request 自动生成的文件。</text>
