<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1510" viewBox="0 0 1320 1510" role="img" aria-labelledby="title desc">
<title id="title">AIGDOS · OS / Pack modules and project runtime</title>
<desc id="desc">Physical capability groups and their connections · v4.98-beta.1. Solid arrows: contracts or execution. Dashed arrow: returned state and evidence. Modules are selected explicitly. This is not a mandatory pipeline or an autonomous scheduler.</desc>
